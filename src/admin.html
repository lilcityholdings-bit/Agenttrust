<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agenttrust admin</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1b1d1f; --muted: #62666b; --line: #dcdcd6;
    --accent: #3b5bdb; --accent-ink: #ffffff; --warn-bg: #fff4d6; --warn-ink: #6b4e00;
    --bad: #b42318; --good: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121416; --panel: #1b1e21; --ink: #e8e9ea; --muted: #9aa0a6; --line: #2e3237;
      --accent: #7c9cff; --accent-ink: #0d1020; --warn-bg: #3a3014; --warn-ink: #f4d58d;
      --bad: #ff8a80; --good: #7fd6a4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 48px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; padding: 11px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  button {
    font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 8px; border: 0;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-top: 10px;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button.small { padding: 6px 10px; margin: 0; font-size: .85rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .key {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem;
    word-break: break-all; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; margin: 10px 0 0;
  }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px; margin-top: 10px; font-size: .9rem; }
  .err { color: var(--bad); margin-top: 10px; font-size: .9rem; }
  .on { color: var(--good); } .off { color: var(--bad); }
  .card { border-top: 1px solid var(--line); padding: 12px 0; }
  .card:first-of-type { border-top: 0; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .nm { font-weight: 600; word-break: break-word; }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .money div { background: var(--bg); border-radius: 8px; padding: 6px 8px; }
  .money b { display: block; font-variant-numeric: tabular-nums; }
  .money span { color: var(--muted); font-size: .78rem; }
  .meta { color: var(--muted); font-size: .85rem; }
  .flag { color: var(--bad); font-size: .85rem; font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
  .empty { color: var(--muted); font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>agenttrust admin</h1>
  <p class="sub">Create API keys for platforms, see what each one owes, and record payments.</p>

  <section>
    <h2>Admin secret</h2>
    <label for="secret">The ADMIN_SECRET from your Railway variables</label>
    <input id="secret" type="password" autocomplete="off" spellcheck="false">
  </section>

  <section>
    <h2>New customer</h2>
    <label for="name">Customer name</label>
    <input id="name" type="text" placeholder="e.g. Bot Arena" autocomplete="off">
    <button id="create">Create API key</button>
    <p class="meta" id="plan"></p>
    <div id="created" hidden>
      <div class="key" id="newkey"></div>
      <div class="row"><button class="secondary small" id="copy" style="margin-top:8px">Copy key</button></div>
      <div class="warn">This key is shown once. Send it to the customer now — it can't be recovered, only revoked and replaced.</div>
    </div>
    <div class="err" id="create-err" hidden></div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Customers</h2>
      <button class="secondary small" id="refresh">Refresh</button>
    </div>
    <div class="err" id="list-err" hidden></div>
    <p class="empty" id="empty">Enter your admin secret and tap Refresh.</p>
    <div id="rows"></div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var secretBox = $("secret");
  try { secretBox.value = sessionStorage.getItem("at_admin") || ""; } catch (e) {}
  secretBox.addEventListener("input", function () {
    try { sessionStorage.setItem("at_admin", secretBox.value); } catch (e) {}
  });

  function call(method, path, body) {
    var opts = { method: method, headers: { "X-Admin-Secret": secretBox.value.trim() } };
    if (body) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data.error || ("request failed (" + r.status + ")"));
        return data;
      });
    });
  }

  function showErr(el, msg) { el.textContent = msg; el.hidden = !msg; }

  $("create").addEventListener("click", function () {
    showErr($("create-err"), "");
    $("created").hidden = true;
    var name = $("name").value.trim();
    if (!name) { showErr($("create-err"), "Enter a customer name first."); return; }
    call("POST", "/v1/customers", { name: name }).then(function (d) {
      $("newkey").textContent = d.api_key;
      $("created").hidden = false;
      $("name").value = "";
      load();
    }).catch(function (e) { showErr($("create-err"), e.message); });
  });

  $("copy").addEventListener("click", function () {
    var text = $("newkey").textContent;
    var btn = $("copy");
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy key"; }, 1500); })
      .catch(function () { btn.textContent = "Select and copy manually"; });
  });

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function dollars(n) { return "$" + Number(n || 0).toFixed(2); }

  function act(label, cls, fn) {
    var b = el("button", "small " + cls, label);
    b.addEventListener("click", fn);
    return b;
  }

  function fail(e) { showErr($("list-err"), e.message); }

  function renderCustomer(c) {
    var card = el("div", "card");
    var top = el("div", "top");
    top.appendChild(el("span", "nm", c.name));
    top.appendChild(el("span", c.purged ? "off" : (c.active ? "on" : "off"), c.purged ? "purged" : (c.active ? "active" : "revoked")));
    card.appendChild(top);

    var money = el("div", "money");
    [["This month", dollars(c.this_month_usd)], ["Owed", dollars(c.balance_usd)], ["Deals / disputes", c.agreements_created + " / " + c.disputes_escalated]]
      .forEach(function (m) {
        var d = el("div");
        d.appendChild(el("b", "", m[1]));
        d.appendChild(el("span", "", m[0]));
        money.appendChild(d);
      });
    card.appendChild(money);

    if (c.overdue) card.appendChild(el("div", "flag", "Overdue: an earlier month is unpaid"));
    if (c.payouts_pending > 0) {
      card.appendChild(el("div", "flag", c.payouts_pending + " unpaid verdict" + (c.payouts_pending === 1 ? "" : "s") + " (they owe bots money)"));
    }

    var actions = el("div", "actions");
    actions.appendChild(act("Record payment", "secondary", function () {
      var amt = prompt("Amount received from " + c.name + " (USD):", c.balance_usd > 0 ? String(c.balance_usd) : "");
      if (!amt) return;
      var ref = prompt("Payment reference (Stripe payment id or USDC transaction hash):");
      if (!ref) return;
      call("POST", "/v1/customers/" + encodeURIComponent(c.customer_id) + "/payments", { amount_usd: Number(amt), reference: ref })
        .then(load).catch(fail);
    }));
    if (c.active) {
      actions.appendChild(act("Revoke", "secondary", function () {
        if (!confirm("Revoke " + c.name + "'s key? Their requests start failing immediately. Their bots' history is kept.")) return;
        call("POST", "/v1/customers/" + encodeURIComponent(c.customer_id) + "/revoke", {}).then(load).catch(fail);
      }));
    }
    if (!c.purged) {
      actions.appendChild(act("Purge for cheating", "danger", function () {
        var typed = prompt("Only for a platform caught farming scores. This revokes " + c.name +
          "'s key and takes back every point it ever gave any bot. Type PURGE to confirm.");
        if (typed !== "PURGE") return;
        call("POST", "/v1/customers/" + encodeURIComponent(c.customer_id) + "/revoke", { purge: true }).then(load).catch(fail);
      }));
    }
    card.appendChild(actions);
    return card;
  }

  function load() {
    showErr($("list-err"), "");
    call("GET", "/v1/customers").then(function (list) {
      var rows = $("rows");
      rows.textContent = "";
      $("empty").textContent = "No customers yet.";
      $("empty").hidden = list.length > 0;
      list.forEach(function (c) { rows.appendChild(renderCustomer(c)); });
    }).catch(function (e) {
      $("rows").textContent = "";
      $("empty").hidden = true;
      showErr($("list-err"), e.message);
    });
  }

  fetch("/v1/pricing").then(function (r) { return r.json(); }).then(function (p) {
    $("plan").textContent = "Plan: " + dollars(p.monthly_usd) + "/month, includes " + p.included_agreements +
      " agreements and " + p.included_lookups + " lookups; then " + dollars(p.agreement_usd) + " per agreement, " +
      dollars(p.dispute_usd) + " per dispute.";
  }).catch(function () {});

  $("refresh").addEventListener("click", load);
  if (secretBox.value) load();
})();
</script>
</body>
</html>
